packages:
  - .
  - amplify
  - web

allowBuilds:
  '@aws-amplify/hosting': true
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

overrides:
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  chokidar: '>=5'
  csv-parse@<7.0.2: ^7.0.2
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  graphql: '>=16'
  handlebars@>=3.0.0 <=4.7.9: ^4.7.10
  immutable@<3.8.4: ^3.8.4
  lodash@>=4.0.0 <=4.17.23: ^4.18.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  mysql2@<=3.23.0: ^3.23.1
  semver: '>=7'
  ua-parser-js: '>=2'
  zod@<4.6.6: ^4.6.6

trustPolicy: no-downgrade
